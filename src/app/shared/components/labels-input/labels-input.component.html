<div class="labels-wrap">
  <div class="chips-input" (click)="inputEl.focus()">
    @for (label of labels(); track label) {
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        {{ label }}
        <button type="button" class="chip-remove" (click)="removeLabel(label)">×</button>
      </span>
    }
    <input
      #inputEl
      class="chip-input"
      [value]="inputValue()"
      [placeholder]="labels().length === 0 ? ('movimentos.labelsPlaceholder' | translate) : ''"
      (input)="onInput($any($event.target).value)"
      (keydown)="onKeydown($event)"
      (focus)="onFocus()"
      (blur)="closeDropdown()"
    />
  </div>

  @if (inputValue().trim() && !showDropdown()) {
    <button type="button" class="add-person-btn" (mousedown)="addLabel(inputValue())">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      {{ 'movimentos.labelsAdd' | translate }}
    </button>
  }

  @if (showDropdown() && suggestions().length > 0) {
    <ul class="dropdown">
      @for (s of suggestions(); track s) {
        <li class="dropdown-item" (mousedown)="addLabel(s)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          {{ s }}
        </li>
      }
    </ul>
  }
</div>
