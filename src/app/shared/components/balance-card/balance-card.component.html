@if (available() !== null) {
  <div class="balance-card">
    <div class="bc-info">
      <span class="bc-label">{{ 'widget.balance' | translate }}</span>
      <span class="bc-hint">{{ 'movimentos.currentBalanceHint' | translate }}</span>
    </div>
    <div class="bc-values">
      <div class="bc-row">
        <span class="bc-sublabel">{{ 'widget.balanceRealized' | translate }}</span>
        <span class="bc-value" [class.bc-value--negative]="available()! < 0">R$ {{ available()! | number:'1.2-2' }}</span>
      </div>
      <div class="bc-row">
        <span class="bc-sublabel">{{ 'widget.balanceProjected' | translate }}</span>
        <span class="bc-value bc-value--projected" [class.bc-value--negative]="(projected() ?? 0) < 0">R$ {{ (projected() ?? 0) | number:'1.2-2' }}</span>
      </div>
    </div>
  </div>
}
