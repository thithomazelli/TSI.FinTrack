<nav class="sidebar">
  <div class="sidebar-brand">FinTrack</div>
  <ul class="sidebar-nav">
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="sidebar-link"
        >
          {{ item.labelKey | translate }}
        </a>
      </li>
    }
  </ul>
</nav>
