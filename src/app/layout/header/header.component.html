<header class="header animate-fade-down">
  <div class="header-left">
    <button class="hamburger" (click)="menuToggle.emit()" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="breadcrumb">{{ pageTitleKey ? (pageTitleKey | translate) : 'TSI FinTrack' }}</span>
  </div>

  @if (session$ | async; as session) {
    <div class="header-right">
      <tsi-language-switcher variant="compact" />
      <button class="btn-theme" (click)="themeService.toggle()" [title]="(themeService.isDark() ? 'theme.light' : 'theme.dark') | translate">
        @if (themeService.isDark()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        }
      </button>
      <div class="user-info">
        <div class="user-avatar">
          {{ session.user.email?.[0]?.toUpperCase() ?? '?' }}
        </div>
        <span class="user-email">{{ session.user.email }}</span>
      </div>
      <button class="btn-signout" (click)="signOut()" title="Sair">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span class="signout-label">Sair</span>
      </button>
    </div>
  }
</header>
