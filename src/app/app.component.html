@if (session$ | async) {
  <tsi-sidebar [open]="menuOpen()" (close)="menuOpen.set(false)" />

  @if (menuOpen()) {
    <div class="sidebar-backdrop" (click)="menuOpen.set(false)"></div>
  }

  <div class="main-layout">
    <tsi-header (menuToggle)="menuOpen.set(!menuOpen())" />
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
